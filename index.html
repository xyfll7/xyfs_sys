<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>黄金棕色示例</title>
  <style>
    .color-box {
      width: 150px;
      height: 100px;
      margin: 10px;
      display: inline-block;
      color: white;
      font-weight: bold;
      line-height: 100px;
      text-align: center;
      border-radius: 8px;
    }

    .golden-brown {
      background-color: #996515;
    }

    .dark-goldenrod {
      background-color: #B8860B;
    }

    .bronze {
      background-color: #CD7F32;
    }

    .ochre {
      background-color: #CC7722;
    }
  </style>
</head>

<body>
  <h2>黄金棕色展示</h2>
  <div class="color-box golden-brown">#996515</div>
  <div class="color-box dark-goldenrod">#B8860B</div>
  <div class="color-box bronze">#CD7F32</div>
  <div class="color-box ochre">#CC7722</div>
</body>

</html>
