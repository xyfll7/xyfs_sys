<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>test</title>

</head>

<body>


</body>
<script>
  function copyText(text) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
  }
  function getMicroAppElement() {
    const microApp = document.querySelector('micro-app[name="goods"]');
    if (microApp && microApp.shadowRoot) {
      const draggableContent = microApp.shadowRoot.querySelector('#props-editor > div.default_box.goods_details > div.box_content > div > form > div:nth-child(1) > div.weui-desktop-form__control-group > div > div.weui-desktop-new-upload__wrp > div');
      if (draggableContent) {
        console.log('成功选中目标元素：', draggableContent);
        return draggableContent;
      }
    }
  }
  const images = getMicroAppElement().querySelectorAll('img');
  // 提取所有图片的 src 属性
  const imageUrls = Array.from(images).map(img => img.src).filter(src => src); // 过滤空 src
  if (imageUrls.length > 0) {
    const images = imageUrls.filter(url => !url.includes('.svg')).map(e => e.split(/[?|#]/)[0]);
    console.log('找到的图片链接地址：', images);
    console.log('图片数量：', images.length);
    // 将图片链接复制到剪贴板
    copyText(images.join('\n'));
    console.log('已将图片链接复制到剪贴板');
  } else {
    console.log('draggable_content 内未找到图片');
  }
</script>

</html>
